;; Benchmark an L2 forwarding device according to RFC2544.
;;
;; if0 is connected to the ingress of the device under test (DUT) and
;; if1 to its egress. The 'rfc2544gen' task offers the test streams
;; while the 'rfc2544lat' task receives the frames forwarded by the
;; DUT and measures frame loss, latency and re-ordering.
;;
;; The first generator of a session also runs the test procedure of
;; RFC2544 section 26: the throughput is found with a binary search
;; (26.1), the latency is measured at that throughput (26.2) and the
;; frame loss rate is measured over a sweep of offered loads (26.3).
;; The results are printed on the log when the test is finished.
;;
;; The device under test only has to forward the frames back, so any
;; layer 2 device (a switch, a bridge or a second PROX instance
;; running the 'l2fwd' mode) can be measured.

[eal options]
-n=4 ; force number of memory channels
no-output=no ; disable DPDK debug output

[port 0]
name=if0
[port 1]
name=if1

[defaults]
mempool size=16K

[global]
start time=5
name=RFC2544 L2 forwarding

[core 0s0]
mode=master

;; Traffic generator and test controller
[core 1s0]
name=rfc2544 gen
task=0
mode=rfc2544gen
tx port=if0
drop=no
rfc2544 session=l2fwd
rfc2544 tests=throughput,latency,loss
rfc2544 frame sizes=64,128,256,512,1024,1280,1518
;; RFC2544 section 24 recommends a trial duration of at least 60 s. A
;; shorter duration can be used to get a first estimate more quickly.
rfc2544 trial duration=60
rfc2544 warm up duration=2
rfc2544 settle duration=2
rfc2544 inter trial gap=2
;; Highest load offered to the device, in percent of the line rate.
rfc2544 start rate=100
;; The binary search stops once the remaining interval is smaller than
;; this percentage of the line rate.
rfc2544 resolution=0.1
;; Loss ratio, in percent, that is still considered a successful trial.
rfc2544 max loss=0
;; Load decrement of the frame loss rate test, in percent of the line rate.
rfc2544 loss step=10
rfc2544 latency trials=1

;; Receiver
[core 2s0]
name=rfc2544 lat
task=0
mode=rfc2544lat
rx port=if1
rfc2544 session=l2fwd
rfc2544 latency bucket nsec=100
